name: grivit-library - build

on:
  push:
    branches:
      - '**'
      - "!main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install aws
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
      
      - name: verify the identity being used
        run: aws sts get-caller-identity

      - name: install kcl
        run: wget -q https://kcl-lang.io/script/install-cli.sh -O - | /bin/bash

      - name: create kcl package
        run: |
          cd grivit-library
          kcl mod pkg --target pkg
      
      - name: list created kcl package
        run: ls -lah grivit-library/pkg
