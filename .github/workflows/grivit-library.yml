name: grivit-library - build

on:
  push:
    branches:
      - '**'
      - "!main"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
  AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY_GRIVIT_KCL_LIBRARY_PACKAGE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: determine version
        run: |
          KCL_PACKAGE_VERSION=${GITHUB_REF_NAME}-snapshot
          echo "{KCL_PACKAGE_VERSION}={${KCL_PACKAGE_VERSION}}" >> "$GITHUB_ENV"

      - name: install aws
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update
      
      - name: install kcl
        run: wget -q https://kcl-lang.io/script/install-cli.sh -O - | /bin/bash
      
      - name: install dasel
        run: |
          curl -sSLf "$(curl -sSLf https://api.github.com/repos/tomwright/dasel/releases/latest | grep browser_download_url | grep linux_amd64 | grep -v .gz | cut -d\" -f 4)" -L -o dasel && chmod +x dasel
          sudo mv ./dasel /usr/local/bin/dasel
      
      - name: verify the identity being used
        run: aws sts get-caller-identity
      
      - name: set version in kcl.mod
        run: dasel put -r toml -f grivit-library/kcl.mod -w toml --indent 0 -t string -v "${KCL_PACKAGE_VERSION}" '.package.version'

      - name: create kcl package
        run: |
          cd grivit-library
          kcl mod pkg --target pkg
      
      - name: list created kcl package
        run: ls -lah grivit-library/pkg
      
      - name: login to ECR registry
        run: |
          AWS_ECR_PASSWORD=$(aws ecr get-login-password --region eu-central-1)
          echo "{AWS_ECR_PASSWORD}={${AWS_ECR_PASSWORD}}" >> "$GITHUB_ENV"
      
      - name: login to registry
        run: kcl registry login -u AWS -p ${AWS_ECR_PASSWORD} ${AWS_ECR_REGISTRY}
      
      - name: push kcl package
        run: kcl mod push --tar_path grivit-library/pkg/grivit-library_${KCL_PACKAGE_VERSION}.tar oci://${AWS_ECR_REGISTRY}/${AWS_ECR_REPOSITORY}
